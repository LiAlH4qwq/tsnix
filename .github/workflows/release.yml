# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: false
  group: release-${{ github.ref }}
jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Build
        run: nix build .#${{ matrix.package }} --print-build-logs
      - name: Stage binary
        run: cp result/bin/tsnix ${{ matrix.asset }} && chmod +x ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: tsnix-x86_64-linux-android
            package: android
            runner: ubuntu-latest
          - asset: tsnix-aarch64-linux-android
            package: android
            runner: ubuntu-24.04-arm
          - asset: tsnix-aarch64-darwin
            package: tsnix
            runner: macos-14
  publish:
    name: Publish release
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
name: Release
"on":
  push:
    tags:
      - v*
  workflow_dispatch: {}
permissions:
  contents: write
