# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: false
  group: update-snix
jobs:
  update:
    name: Bump snix-eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - id: bump
        name: Update the snix-eval pin
        run: ./.github/scripts/update-snix.sh
      - if: steps.bump.outputs.changed == 'true'
        name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          body: |-
            Automated weekly bump of the pinned `snix-eval` revision.

            - revision: `${{ steps.bump.outputs.rev }}`
            - refreshed `nix/constants.nix`
            - self-tested with `nix build .#tsnix`
          branch: snix/update
          commit-message: 'chore: update snix-eval to ${{ steps.bump.outputs.rev }}'
          delete-branch: true
          labels: dependencies
          title: 'chore: update snix-eval to ${{ steps.bump.outputs.rev }}'
          token: ${{ secrets.SNIX_UPDATE_TOKEN || github.token }}
    timeout-minutes: 90
name: Update snix-eval
"on":
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
