[package]
name = "tsnix"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "A minimal, embeddable Nix-language evaluator CLI built solely on snix-eval (no store)."
repository = "https://git.snix.dev/snix/snix"
keywords = ["nix", "snix", "evaluator", "cli", "json"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[workspace]

[lib]
name = "tsnix"
path = "src/lib.rs"

[[bin]]
name = "tsnix"
path = "src/main.rs"

[dependencies]
# snix-eval is not published on crates.io; pin the upstream revision.
# `default-features = false` drops `arbitrary` (proptest) and `nix_tests`.
snix-eval = { git = "https://git.snix.dev/snix/snix.git", rev = "1a4727d22fbff5d7d99c7cf76f0f3d1c4be045b3", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Pure-Rust; already in snix-eval's tree. Used to render error spans.
codemap = "0.1"

# REPL only; gated behind the default `repl` feature.
rustyline = { version = "18", optional = true }
rnix = { version = "0.14", optional = true }
# Must match snix-eval's versions so `env`/`Value` types line up.
smol_str = { version = "0.2", optional = true }
rustc-hash = { version = "2", optional = true }

# Browser wasm scaffold.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# Used to parse-check `src/stdlib.nix` independently of the `repl` feature.
rnix = "0.14"

[features]
default = ["local-io", "repl", "stdlib"]
# Enables `--io local` (import/readFile/…) via snix-eval's `impure` feature and
# its std-backed `StdIO`. Disable for a pure, no-filesystem build (e.g. wasm).
local-io = ["snix-eval/impure"]
# Enables the `tsnix repl` subcommand (friendly + agent modes).
repl = ["dep:rustyline", "dep:rnix", "dep:smol_str", "dep:rustc-hash"]
# Enables the pure-Nix `std` standard library (`builtins.std`, plus a bare
# `std` prelude binding). Pure functions only: no store, no I/O.
stdlib = []
# Browser wasm-bindgen scaffold (wasm32-unknown-unknown).
wasm = ["dep:wasm-bindgen"]
# Forward snix-eval's memory optimisation to reduce peak RSS on embedded devices.
no-leak = ["snix-eval/no_leak"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
