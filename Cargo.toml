[package]
name = "tsnix"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "A minimal, embeddable Nix-language evaluator CLI built solely on snix-eval (no store)."
repository = "https://git.snix.dev/snix/snix"
keywords = ["nix", "snix", "evaluator", "cli", "json"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[workspace]

[lib]
name = "tsnix"
path = "src/lib.rs"

[[bin]]
name = "tsnix"
path = "src/main.rs"

[dependencies]
# snix-eval is not published on crates.io; pin the upstream revision.
# `default-features = false` drops `arbitrary` (proptest) and `nix_tests`.
snix-eval = { git = "https://git.snix.dev/snix/snix.git", rev = "8fa52da9f8e8ae70f31d565855fb73da7388df51", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Pure-Rust; already in snix-eval's tree. Used to render error spans.
codemap = "0.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# Same parser snix-eval uses; lets us assert every stub is parseable.
rnix = "0.14"

[features]
default = ["local-io"]
# Enables `--io local` (import/readFile/…) via snix-eval's `impure` feature and
# its std-backed `StdIO`. Disable for a pure, no-filesystem build (e.g. wasm).
local-io = ["snix-eval/impure"]
# Forward snix-eval's memory optimisation to reduce peak RSS on embedded devices.
no-leak = ["snix-eval/no_leak"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
